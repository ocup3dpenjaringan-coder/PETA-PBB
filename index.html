const WARNA = {
  "KAMAL MUARA": "#e41a1c",
  "KAPUK MUARA": "#377eb8",
  "PEJAGALAN":   "#4daf4a",
  "PLUIT":       "#ff7f00",
  "PENJARINGAN": "#984ea3"
};
const WARNA_LAIN = "#555555";

const esriJalan = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 21, maxNativeZoom: 19, attribution: "Tiles &copy; Esri"
});
const satelit = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 21, maxNativeZoom: 19, attribution: "Tiles &copy; Esri"
});
const topo = L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 21, maxNativeZoom: 19, attribution: "Tiles &copy; Esri"
});
// OpenStreetMap: hanya jalan jika halaman dibuka lewat http://localhost (bukan file langsung)
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 21, maxNativeZoom: 19, attribution: "&copy; OpenStreetMap contributors"
});

const map = L.map("map", { layers: [esriJalan], preferCanvas: true });

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function popup(d) {
  const fotoHtml = d.foto
    ? `<div style="margin-bottom:8px; text-align:center;">
         <a href="${esc(d.foto)}" target="_blank" rel="noopener" title="Buka foto di tab baru">
           <img src="${esc(d.foto)}" alt="Foto Objek"
                style="width:100%; max-height:180px; object-fit:cover; border-radius:5px; border:1px solid #ddd; display:block; margin-bottom:4px;"
                onerror="this.style.display='none'">
           <span style="font-size:11px; color:#0b57d0; text-decoration:underline;">Buka Foto Server ↗</span>
         </a>
       </div>`
    : "";

  return `<div class="pop">${fotoHtml}<table>
    <tr><td>NOP.</td><td>${esc(d.nop)}</td></tr>
            <tr><td>NAMA WP</td><td>${esc(d.nama)}</td></tr>
    <tr><td>KELURAHAN OBJEK</td><td>${esc(d.kel)}</td></tr>
    <tr><td>ALAMAT OBJEK APJAK</td><td>${esc(d.alamat)}</td></tr>
    <tr><td>TOT. LUAS BUMI</td><td>${d.bumi.toLocaleString("id-ID")}</td></tr>
    <tr><td>TOT. LUAS BANGUNAN</td><td>${d.bangunan.toLocaleString("id-ID")}</td></tr>
    <tr><td>JPB OP</td><td>${esc(d.jpb)}</td></tr>
    <tr><td>JENIS BUMI</td><td>${esc(d.jenis)}</td></tr>
    <tr><td>NAMA OBJEK PAJAK</td><td>${esc(d.objek)}</td></tr>
  </table>
  <div class="rute"><b>Rute Sepeda Motor</b>
    <div class="info">Mencari lokasi Anda...</div>
    <a class="btn gmaps" target="_blank" rel="noopener"
       href="https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}&travelmode=two-wheeler">Buka di Google Maps (motor)</a>
    <div class="langkah"></div>
  </div>
</div>`;
}

const groups = {};
const markers = [];
DATA.forEach(d => {
  const warna = WARNA[d.kel] || WARNA_LAIN;
  let m;
  if (ICONS[d.kel]) {
    m = L.marker([d.lat, d.lng], {
      icon: L.icon({
        iconUrl: ICONS[d.kel],
        iconSize: [28, 42],
        iconAnchor: [14, 42],      // ujung bawah pin = titik koordinat
        popupAnchor: [0, -38],
        tooltipAnchor: [14, -22]
      })
    });
  } else {
    m = L.circleMarker([d.lat, d.lng], {
      radius: 6, color: "#222", weight: 1, fillColor: warna, fillOpacity: 0.9
    });
  }
  m.bindPopup(popup(d), { maxWidth: 360, minWidth: 280 })
   .bindTooltip(esc(d.no + ". " + d.nama), {
     permanent: true, direction: "right", className: "label-titik", opacity: 1
   });
  m._d = d;
  m.on("mouseover", () => {
    const tt = m.getTooltip(), el = tt && tt.getElement();
    if (el) { el.style.visibility = "visible"; el.style.zIndex = 1000; }
  });
  m.on("mouseout", () => {
    const tt = m.getTooltip(), el = tt && tt.getElement();
    if (el) el.style.zIndex = "";
    jadwalLabel();
  });
  (groups[d.kel] = groups[d.kel] || L.layerGroup()).addLayer(m);
  markers.push(m);
});

const overlays = {};
Object.keys(groups).sort().forEach(k => {
  const n = DATA.filter(d => d.kel === k).length;
  overlays[`${ICONS[k] ? `<img src="${ICONS[k]}" style="height:16px;vertical-align:middle">` : "●"} ${k} (${n})`] = groups[k];
  groups[k].addTo(map);
});

const lc = L.control.layers({ "Peta Jalan (Esri)": esriJalan, "Satelit (Esri)": satelit, "Topografi (Esri)": topo, "OpenStreetMap*": osm }, overlays, { collapsed: false }).addTo(map);

// Tombol tutup (x) pada panel layer di kanan atas; ikon layer muncul untuk membukanya lagi
(function () {
  const box = lc.getContainer();
  const list = box.querySelector(".leaflet-control-layers-list");
  const toggle = box.querySelector(".leaflet-control-layers-toggle");
  const bar = document.createElement("div");
  bar.className = "tutup-bar";
  bar.innerHTML = '<b>Layer peta</b><button type="button" class="tutup" title="Tutup">&times;</button>';
  list.insertBefore(bar, list.firstChild);
  const tutup = () => box.classList.remove("leaflet-control-layers-expanded");
  const buka = () => box.classList.add("leaflet-control-layers-expanded");
  bar.querySelector("button").addEventListener("click", e => { e.preventDefault(); tutup(); });
  toggle.title = "Buka layer peta";
  toggle.addEventListener("click", e => { e.preventDefault(); buka(); });
  if (window.innerWidth < 700) tutup();   // di HP, mulai dalam keadaan tertutup
})();
L.control.scale({ imperial: false }).addTo(map);

map.fitBounds(L.latLngBounds(DATA.map(d => [d.lat, d.lng])).pad(0.05));

// Legenda + pencarian
const info = L.control({ position: "bottomleft" });
info.onAdd = function () {
  const div = L.DomUtil.create("div", "panel legend");
  div.innerHTML = `<div class="isi"><button type="button" class="tutup" title="Tutup">&times;</button>` +
    `<h4>Objek PBB: ${DATA.length} titik</h4>` +
    Object.keys(WARNA).map(k => `<div><img src="${ICONS[k]}" style="height:18px;vertical-align:middle;margin-right:6px">${k}</div>`).join("") +
    `<label style="display:block;margin:7px 0 3px;cursor:pointer"><input type="checkbox" id="tglLabel" checked> Label no. &amp; nama (saat zoom dekat)</label>` +
    `<input id="cari" placeholder="Cari nama / NOP / alamat...">
     <div id="hasil" style="color:#555"></div>
     <div style="color:#999;font-size:10px;margin-top:5px">versi 11-11-26b</div></div>
     <button type="button" class="mini" title="Buka legenda">Legenda / Cari</button>`;
  const isi = div.querySelector(".isi");
  const mini = div.querySelector(".mini");
  const tutup = () => { isi.style.display = "none"; mini.style.display = "block"; div.classList.add("kecil"); };
  const buka = () => { isi.style.display = ""; mini.style.display = "none"; div.classList.remove("kecil"); };
  div.querySelector(".tutup").addEventListener("click", tutup);
  mini.addEventListener("click", buka);
  if (window.innerWidth < 700) tutup();   // di HP, mulai dalam keadaan tertutup
  L.DomEvent.disableClickPropagation(div);
  L.DomEvent.disableScrollPropagation(div);
  return div;
};
info.addTo(map);

// ===== Pencarian: nama WP, NOP (boleh tanpa titik), alamat, nama objek, kelurahan =====
// Hasil otomatis dituju di peta; titik yang ditemukan diberi tanda silang merah.
// <cari>
(function () {
  const input = document.getElementById("cari");
  const out = document.getElementById("hasil");
  const BATAS = 10;
  let hit = [], terakhir = null, tunda = 0;

  // Tanda silang merah (garis putih di bawahnya agar tetap terlihat di atas pin merah)
  const SVG_X = '<svg xmlns="http://www.w3.org/2000/svg" width="28" height="42" viewBox="0 0 28 42">' +
    '<g fill="none" stroke-linecap="round">' +
    '<path d="M7 8 L21 22 M21 8 L7 22" stroke="#ffffff" stroke-width="7"/>' +
    '<path d="M7 8 L21 22 M21 8 L7 22" stroke="#e00000" stroke-width="4"/></g></svg>';
  const IKON_X = L.divIcon({ className: "tanda-x", html: SVG_X, iconSize: [28, 42], iconAnchor: [14, 42] });
  const tanda = L.layerGroup().addTo(map);

  markers.forEach(m => {
    const d = m._d;
    m._teks = (d.nama + " " + d.nop + " " + d.alamat + " " + d.objek + " " + d.kel).toLowerCase();
    m._nop = d.nop.replace(/[^0-9]/g, "");
  });

  function aktifkan(m) {                        // nyalakan layer kelurahan jika sedang dimatikan
    const g = groups[m._d.kel];
    if (g && !map.hasLayer(g)) g.addTo(map);
  }

  function sorot(list) {
    tanda.clearLayers();
    markers.forEach(m => { m._sorot = false; });
    list.forEach(m => {
      aktifkan(m);
      m._sorot = true;
      L.marker(m.getLatLng(), { icon: IKON_X, interactive: false, keyboard: false, zIndexOffset: 5000 }).addTo(tanda);
    });
    jadwalLabel();
  }

  function pergi(m) {
    aktifkan(m);
    map.setView(m.getLatLng(), 18);
    m.openPopup();
  }

  function semua() {
    map.fitBounds(L.latLngBounds(hit.map(m => m.getLatLng())).pad(0.2));
  }

  function cari() {
    const q = input.value.trim().toLowerCase();
    if (q.length < 3) { hit = []; terakhir = null; out.innerHTML = ""; sorot([]); return; }
    const angka = q.replace(/[^0-9]/g, "");
    const hanyaNomor = /^[0-9. ]+$/.test(q);
    hit = markers.filter(m => m._teks.includes(q) || (hanyaNomor && angka.length >= 3 && m._nop.includes(angka)));
    if (!hit.length) { terakhir = null; out.textContent = "Tidak ditemukan"; sorot([]); return; }

    let html = "<div style='margin:4px 0'>" + hit.length + " ditemukan</div>";
    hit.slice(0, BATAS).forEach((m, i) => {
      html += "<div class='item' data-i='" + i + "'><img src='" + (ICONS[m._d.kel] || "") +
              "' style='height:16px;vertical-align:middle;margin-right:5px'>" +
              esc(m._d.no + ". " + m._d.nama) + "<br><small>" + esc(m._d.kel) + "</small></div>";
    });
    if (hit.length > 1) html += "<div class='item semua'><b>Lihat semua hasil di peta</b></div>";
    if (hit.length > BATAS) html += "<div style='margin-top:3px'><small>dan " + (hit.length - BATAS) + " lainnya, persempit pencarian</small></div>";
    out.innerHTML = html;

    sorot(hit);
    if (hit.length === 1) {                      // satu hasil: langsung menuju titiknya
      if (terakhir !== hit[0]) pergi(hit[0]);
      terakhir = hit[0];
    } else {                                     // beberapa hasil: tampilkan semuanya
      terakhir = null;
      semua();
    }
  }

  input.addEventListener("input", () => { clearTimeout(tunda); tunda = setTimeout(cari, 350); });
  input.addEventListener("keydown", e => {
    if (e.key !== "Enter" && e.keyCode !== 13) return;
    e.preventDefault();
    clearTimeout(tunda);
    terakhir = null;                             // paksa menuju titik walau sudah pernah dituju
    cari();
  });
  out.addEventListener("click", e => {
    const item = e.target.closest(".item");
    if (!item) return;
    if (item.classList.contains("semua")) semua();
    else { const m = hit[+item.dataset.i]; terakhir = m; pergi(m); }
  });
})();
// </cari>

// ===== Label no. & nama: tampil saat zoom dekat, label yang bertumpuk disembunyikan =====
// <label>
const LABEL_ZOOM = 16;
let labelAktif = true, jadwalId = 0;

function aturLabel() {
  const tampil = labelAktif && map.getZoom() >= LABEL_ZOOM;
  map.getContainer().classList.toggle("tanpa-label", !tampil);
  if (!tampil) return;
  const ukuran = map.getSize();
  const terpasang = [];
  markers.forEach(m => {
    if (!map.hasLayer(m)) return;
    const p = map.latLngToContainerPoint(m.getLatLng());
    if (p.x < -250 || p.x > ukuran.x + 250 || p.y < -60 || p.y > ukuran.y + 60) return;
    terpasang.push({ m: m, p: p });
  });
  terpasang.sort((a, b) => ((b.m._sorot ? 1 : 0) - (a.m._sorot ? 1 : 0)) || (a.p.y - b.p.y) || (a.p.x - b.p.x));
  const dipakai = [];
  terpasang.forEach(o => {
    const tt = o.m.getTooltip();
    const el = tt && tt.getElement();
    if (!el) return;
    if (!o.m._lw) o.m._lw = (o.m._d.no + ". " + o.m._d.nama).length * 6.8 + 16;
    const r = { x1: o.p.x + 14, x2: o.p.x + 14 + o.m._lw, y1: o.p.y - 35, y2: o.p.y - 9 };
    const bentrok = dipakai.some(q => r.x1 < q.x2 && r.x2 > q.x1 && r.y1 < q.y2 && r.y2 > q.y1);
    el.style.visibility = bentrok ? "hidden" : "visible";
    if (!bentrok) dipakai.push(r);
  });
}
function jadwalLabel() {
  cancelAnimationFrame(jadwalId);
  jadwalId = requestAnimationFrame(aturLabel);
}
// </label>
map.on("zoomend moveend layeradd layerremove", jadwalLabel);
document.getElementById("tglLabel").addEventListener("change", function () {
  labelAktif = this.checked;
  jadwalLabel();
});
jadwalLabel();

// ===== Rute sepeda motor otomatis saat titik diklik =====
// Rute digambar di peta memakai Valhalla (data OpenStreetMap, profil motorcycle).
// Tombol "Buka di Google Maps" membuka rute motor (two-wheeler) di Google Maps asli.
const VALHALLA = "https://valhalla1.openstreetmap.de/route";
let routeSeq = 0, routeLayer = null;

// <decoder>
function decodePoly(str, prec) {
  const f = Math.pow(10, prec || 6);
  let i = 0, lat = 0, lng = 0;
  const out = [];
  while (i < str.length) {
    let b, shift = 0, res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
    lat += (res & 1) ? ~(res >> 1) : (res >> 1);
    shift = 0; res = 0;
    do { b = str.charCodeAt(i++) - 63; res |= (b & 31) << shift; shift += 5; } while (b >= 32);
    lng += (res & 1) ? ~(res >> 1) : (res >> 1);
    out.push([lat / f, lng / f]);
  }
  return out;
}
// </decoder>

function clearRoute() {
  if (routeLayer) { map.removeLayer(routeLayer); routeLayer = null; }
}

function getUserPos() {
  return new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      p => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
      () => resolve(null),
      { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
    );
  });
}

async function ambilRute(a, b) {
  for (const costing of ["motorcycle", "motor_scooter"]) {
    const q = {
      locations: [{ lat: a.lat, lon: a.lng }, { lat: b.lat, lon: b.lng }],
      costing: costing,
      directions_options: { units: "kilometers", language: "id-ID" }
    };
    try {
      const r = await fetch(VALHALLA + "?json=" + encodeURIComponent(JSON.stringify(q)));
      if (!r.ok) continue;
      const j = await r.json();
      if (j.trip && j.trip.legs && j.trip.legs.length) return j.trip;
    } catch (err) { /* coba profil berikutnya */ }
  }
  return null;
}

function fmtWaktu(detik) {
  const m = Math.max(1, Math.round(detik / 60));
  return m >= 60 ? Math.floor(m / 60) + " jam " + (m % 60) + " menit" : m + " menit";
}

map.on("popupopen", async e => {
  const d = e.popup._source && e.popup._source._d;
  if (!d) return;
  const el = e.popup.getElement();
  const info = el.querySelector(".rute .info");
  const gm = el.querySelector(".rute .gmaps");
  const langkah = el.querySelector(".rute .langkah");
  const seq = ++routeSeq;
  clearRoute();

  const pos = await getUserPos();
  if (seq !== routeSeq) return;
  if (!pos) {
    info.textContent = "Lokasi Anda tidak terbaca. Izinkan akses lokasi di browser, atau pakai tombol Google Maps.";
    return;
  }

  gm.href = "https://www.google.com/maps/dir/?api=1&origin=" + pos.lat + "," + pos.lng +
            "&destination=" + d.lat + "," + d.lng + "&travelmode=two-wheeler";
  info.textContent = "Menghitung rute motor...";

  const trip = await ambilRute(pos, d);
  if (seq !== routeSeq) return;
  if (!trip) {
    info.textContent = "Rute di peta gagal dimuat (cek internet). Gunakan tombol Google Maps.";
    return;
  }

  const garis = decodePoly(trip.legs[0].shape, 6);
  routeLayer = L.layerGroup([
    L.polyline(garis, { color: "#ffffff", weight: 9, opacity: 0.9 }),
    L.polyline(garis, { color: "#1a73e8", weight: 5, opacity: 0.95 }),
    L.circleMarker([pos.lat, pos.lng], {
      radius: 8, color: "#ffffff", weight: 3, fillColor: "#1a73e8", fillOpacity: 1
    }).bindTooltip("Lokasi Anda")
  ]).addTo(map);
  map.fitBounds(L.latLngBounds(garis).pad(0.15));

  info.innerHTML = "<b>" + trip.summary.length.toFixed(1) + " km</b> &middot; " + fmtWaktu(trip.summary.time);
  const mv = trip.legs[0].maneuvers || [];
  if (mv.length) {
    langkah.innerHTML = "<details><summary>Petunjuk arah</summary><ol>" +
      mv.map(m => "<li>" + esc(m.instruction || "") + "</li>").join("") + "</ol></details>";
  }
});

map.on("popupclose", () => { routeSeq++; clearRoute(); });
</script>
